name: hoho_hanja
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.24+41

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_dotenv: ^5.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  dio: ^5.7.0
  http: ^1.6.0 # 영수증 검증 요청에 직접 사용 (C-47)
  xml: ^7.0.1 # SVG 경로 파싱에 직접 사용 (C-47)
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  logger: ^2.4.0
  sign_in_with_apple: ^8.2.0 # 애플 소셜로그인
  kakao_flutter_sdk: ^2.1.0 # 카카오 소셜로그인
  google_sign_in: ^7.2.0 # 구글 소셜로그인
  hive: ^2.2.3 # 로컬 저장소
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  carousel_slider: ^5.0.0
  lottie: ^3.1.2
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^6.0.5
  just_audio: ^0.9.41
  flame: ^1.21.0
  path_drawing: ^1.0.1
  flip_card: ^0.7.0
  flutter_native_splash: ^2.4.3
  package_info_plus: ^10.2.2
  in_app_purchase: ^3.3.0
  app_version_update: ^7.0.0
  in_app_purchase_storekit: ^0.4.0
  in_app_purchase_android: ^0.5.3 # 안드로이드 소비·미소비 결제 조회에 직접 사용

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.4.0 # 개발용 도구 (C-47)
  flutter_launcher_icons: ^0.14.1 # 개발용 도구 (C-47)
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: "AppIcon"
  image_path_ios: "assets/images/ic_launcher.png"
  image_path_android: "assets/images/ic_launcher.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/social/
    - assets/images/icon/
    - assets/images/bake/
    - assets/images/cookie/
    - assets/images/myroom/
    - assets/images/myroom/background/
    - assets/images/myroom/character/
    - assets/images/myroom/clothes/
    - assets/images/myroom/hats/
    - assets/lottie/

    - assets/text/

    - assets/audio/bgm/
    - assets/audio/effect/

    - assets/certs/

    - .env

  fonts:
    - family: G-Sans
      fonts:
        - asset: assets/fonts/GmarketSansTTFMedium.ttf
        - asset: assets/fonts/GmarketSansTTFBold.ttf
        - asset: assets/fonts/GmarketSansTTFLight.ttf
    - family: NotoSansKR-Regular
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
    - family: NotoSansKR-SemiBold
      fonts:
        - asset: assets/fonts/NotoSansKR-SemiBold.ttf
    - family: NotoSansKR-Bold
      fonts:
        - asset: assets/fonts/NotoSansKR-Bold.ttf
    - family: BMJUA
      fonts:
        - asset: assets/fonts/BMJUA.ttf
